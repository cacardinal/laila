<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: #101317;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    display: flex; flex-direction: column; justify-content: center; padding: 0 110px;
  }
  .prompt { color: #6e7883; font-size: 34px; margin-bottom: 18px; }
  .word { font-size: 150px; font-weight: 700; letter-spacing: 2px; color: #e6e9ec; }
  .word .ai { color: #7ea1f0; text-shadow: 0 0 34px rgba(126,161,240,.55); }
  .cursor { display: inline-block; width: 56px; height: 108px; background: #e6e9ec; margin-left: 18px; vertical-align: -6px; animation: none; opacity: .9; }
  .tag { color: #aab3bd; font-size: 34px; margin-top: 34px; line-height: 1.5; }
  .tag .dim { color: #6e7883; font-size: 27px; white-space: nowrap; display: inline-block; margin-top: 6px; }
  .foot { position: absolute; bottom: 44px; left: 110px; color: #6e7883; font-size: 24px; }
  .foot b { color: #86efac; font-weight: 600; }
</style></head>
<body>
  <div class="prompt">~ $</div>
  <div class="word">l<span class="ai">AI</span>la<span class="cursor"></span></div>
  <div class="tag">an operating system for a life run with AI agents<br>
  <span class="dim">your world as plain files · hard autonomy lines · any harness</span></div>
  <div class="foot"><b>✓</b> github.com/cacardinal/laila</div>
</body></html>
