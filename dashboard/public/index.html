<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laila</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%233d6ce0'/%3E%3Ctext x='8' y='11.5' font-size='9' font-family='sans-serif' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="wrap header-row">
      <h1>Laila <span class="sub">status</span></h1>
      <div class="header-right">
        <span id="generated" class="muted"></span>
        <button id="theme-toggle" type="button" aria-label="Toggle color theme">◐</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="tiles" class="tiles" aria-label="Summary"></section>

    <section aria-labelledby="h-tasks">
      <h2 id="h-tasks">Active tasks</h2>
      <div id="tasks" class="card"></div>
    </section>

    <section aria-labelledby="h-comms">
      <h2 id="h-comms">Pending comms &amp; brief items</h2>
      <div id="comms" class="card"></div>
    </section>

    <section aria-labelledby="h-loops">
      <h2 id="h-loops">Background loops</h2>
      <div id="loops" class="card"></div>
    </section>

    <section aria-labelledby="h-domains">
      <h2 id="h-domains">Domains</h2>
      <div id="domains" class="domain-grid"></div>
    </section>

    <section aria-labelledby="h-crm">
      <h2 id="h-crm">CRM (Twenty)</h2>
      <div id="crm" class="card"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
