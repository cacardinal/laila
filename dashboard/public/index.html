<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laila</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%233d6ce0'/%3E%3Ctext x='8' y='11.5' font-size='9' font-family='sans-serif' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="wrap header-row">
      <h1>Laila</h1>
      <nav id="tabs" aria-label="Sections">
        <button data-tab="home" class="active">Home</button>
        <button data-tab="strategy">Strategy</button>
        <button data-tab="briefs">Briefs</button>
        <button data-tab="review">Review</button>
        <button data-tab="messages">Messages</button>
        <button data-tab="calendar">Calendar</button>
        <button data-tab="loops">Loops</button>
        <button data-tab="homeauto">House</button>
      </nav>
      <div class="header-right">
        <span id="generated" class="muted"></span>
        <button id="theme-toggle" type="button" aria-label="Toggle color theme">◐</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="view-home" class="view">
      <section id="tiles" class="tiles" aria-label="Summary"></section>
      <section><h2>Active tasks</h2><div id="tasks" class="card"></div></section>
      <section><h2>Domains</h2><div id="domains" class="domain-grid"></div></section>
      <section><h2>CRM (Twenty)</h2><div id="crm" class="card"></div></section>
    </div>

    <div id="view-strategy" class="view hidden">
      <section><h2>Strategy — the source of truth for priorities</h2><div id="strategy" class="card md"></div></section>
    </div>

    <div id="view-briefs" class="view hidden">
      <section>
        <h2>Daily briefs <span id="brief-picker" class="muted"></span></h2>
        <div id="brief" class="card md"></div>
      </section>
    </div>

    <div id="view-review" class="view hidden">
      <section><h2>Running brief — pending your call</h2><div id="review-pending" class="card"></div></section>
      <section><h2>Autonomy audit — what ran on its own</h2><div id="audit" class="card"></div></section>
    </div>

    <div id="view-messages" class="view hidden">
      <section><h2>Comms queue</h2><div id="messages" class="card"></div></section>
    </div>

    <div id="view-calendar" class="view hidden">
      <section><h2>Calendar <span id="cal-note" class="muted"></span></h2><div id="calendar" class="card"></div></section>
    </div>

    <div id="view-loops" class="view hidden">
      <section><h2>Background loops</h2><div id="loops" class="card"></div></section>
    </div>

    <div id="view-homeauto" class="view hidden">
      <section id="ha-alerts"></section>
      <section><h2>Rooms &amp; devices <span id="ha-source" class="muted"></span></h2><div id="ha-rooms" class="domain-grid"></div></section>
      <section><h2>Scenes</h2><div id="ha-scenes" class="card"></div></section>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
